function closeStockItem(){ const o=$('siOv'); if(o) o.remove(); }

function onGrpChange() {
  const sel=$('si-grp'), inp=$('si-grp-new');
  if (!inp) return;
  if (sel && sel.value==='__new__') { inp.style.display=''; setTimeout(()=>inp.focus(),50); }
  else inp.style.display='none';
}

function openGrpMgr() {
  const groups=S.cache.stock.groups||[], items=S.cache.stock.items||[];
  const cnt={}; items.forEach(i=>{cnt[i.grp]=(cnt[i.grp]||0)+1;});
  const rows=groups.length ? groups.map(g=>{
    const n=cnt[g]||0;
    return `<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)">
      <span style="flex:1;font-size:15px">${esc(g)}</span>
      <span style="font-size:12px;color:var(--sub)">${n} ລາຍການ</span>
      <button onclick="deleteGroup('${g.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}',${n})"
        style="background:var(--card);border:1.5px solid #EBD8D6;color:var(--red);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer">ລຶບ</button>
    </div>`;
  }).join('') : `<p style="text-align:center;color:var(--sub);padding:20px 0">ຍັງບໍ່ມີກຸ່ມ</p>`;
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='grpOv';
  ov.onclick=e=>{if(e.target===ov)closeGrpMgr();};
  ov.innerHTML=`<div class="sheet"><div class="handle"></div>
    <h3>ຈັດການກຸ່ມ</h3>
    <div>${rows}</div>
    <button class="btn-o" style="margin-top:14px" onclick="closeGrpMgr()">ປິດ</button>
  </div>`;
  document.body.appendChild(ov);
}
function closeGrpMgr(){const o=$('grpOv');if(o)o.remove();}

function deleteGroup(grp,count){
  if(count>0){toast('ມີ '+count+' ລາຍການໃນກຸ່ມນີ້ — ກາລຸນາປ່ຽນກຸ່ມຂອງລາຍການທັງໝົດກ່ອນ',false);return;}
  if(!confirm('ລຶບກຸ່ມ "'+grp+'"?'))return;
  S.cache.stock.groups=(S.cache.stock.groups||[]).filter(g=>g!==grp);
  closeGrpMgr();
  const sel=$('si-grp');
  if(sel){
    const cur=sel.value;
    sel.innerHTML=(S.cache.stock.groups||[]).map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')+'<option value="__new__">+ ເພີ່ມກຸ່ມໃໝ່...</option>';
    if(cur!==grp&&(S.cache.stock.groups||[]).includes(cur)) sel.value=cur;
    else if(S.cache.stock.groups&&S.cache.stock.groups.length) sel.value=S.cache.stock.groups[0];
    else sel.value='__new__';
    onGrpChange();
  }
  toast('ລຶບກຸ່ມ "'+grp+'" ແລ້ວ');
}

async function delStockItem(id, name) {
  if (!confirm('ລຶບ "' + name + '" ອອກຈາກສາງຢາ?\n\nຖ້າເຄີຍມີການຮັບເຂົ້າ/ເບີກອອກ ລະບົບຈະເຊື່ອງໄວ້ ແທນການລຶບ ເພື່ອຮັກສາປະຫວັດ')) return;
  try {
    const r = await api('df_stock_item_delete', {p_token: S.token, p_id: id});
    if (!r.ok) return toast(r.error, false);
    closeStockItem(); toast(r.message || 'ລຶບແລ້ວ'); loadStock();
  } catch (e) { toast(e.message, false); }
}

async function saveStockItem(id) {
  const name = $('si-name').value.trim();
  if (!name) return toast('ກະລຸນາໃສ່ຊື່ລາຍການ', false);
  const grpSel = $('si-grp');
  let grpVal = grpSel ? grpSel.value : null;
  if (grpVal === '__new__') {
    grpVal = $('si-grp-new') ? $('si-grp-new').value.trim() : '';
    if (!grpVal) return toast('ກະລຸນາໃສ່ຊື່ກຸ່ມໃໝ່', false);
  }
  const act    = $('si-active');
  const imgInp = $('si-img');
  let img_url  = null;
  if (imgInp && imgInp.files && imgInp.files[0]) {
    const btn = document.querySelector('#siOv .btn-p');
    if (btn) { btn.disabled = true; btn.textContent = 'ກຳລັງອັບໂຫລດ...'; }
    try { img_url = await uploadStockImage(imgInp.files[0]); }
    catch(e) { if (btn) { btn.disabled=false; btn.textContent='ບັນທຶກ'; }
      return toast('ອັບໂຫລດຮູບລົ້ມເຫຼວ: ' + e.message, false); }
  }
  try {
    const params = {p_token: S.token, p_id: id,
      p_name: name, p_unit: $('si-unit').value,
      p_min: Number($('si-min').value)||0,
      p_grp:    grpVal,
      p_active: act ? act.checked : true};
    const r = await api('df_stock_item_save', params);
    if (!r.ok) return toast(r.error, false);
    if (id) {
      const origSel = $('si-origin');
      if (origSel) {
        try { await api('df_stock_set_origin', {p_token: S.token, p_id: id, p_origin: origSel.value||null}); }
        catch(e2) { toast('ບໍ່ສາມາດບັນທຶກແຫຼ່ງທີ່ມາ: ' + e2.message, false); }
      }
      if (img_url) {
        try { await api('df_stock_set_img_url', {p_token: S.token, p_id: id, p_img_url: img_url}); }
        catch(e2) { toast('ບໍ່ສາມາດບັນທຶກຮູບ: ' + e2.message, false); }
      }
    }
    closeStockItem(); toast('ບັນທຶກແລ້ວ'); loadStock();
  } catch (e) { toast(e.message, false); }
}

/* ──────────── Stock image helpers ──────────── */
function prevStockImg(inp) {
  const wrap = $('si-img-preview-wrap');
  if (!wrap) return;
  if (!inp.files || !inp.files[0]) { wrap.innerHTML = ''; return; }
  const url = URL.createObjectURL(inp.files[0]);
  wrap.innerHTML = `<div style="text-align:center;margin-bottom:8px">
    <img src="${url}" style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line)">
  </div>`;
}

async function uploadStockImage(file) {
  if (file.size > 5 * 1024 * 1024) throw new Error('ໄຟລ໌ໃຫຍ່ເກີນ 5 MB');
  const ext   = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const fname = Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  const res   = await fetch(`${SB_URL}/storage/v1/object/stock-images/${fname}`, {
    method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': file.type || 'image/jpeg' },
    body: file
  });
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  return `${SB_URL}/storage/v1/object/public/stock-images/${fname}`;
}

/* ──────────── Stock history (by date) ──────────── */
async function loadStockHistory() {
  const wrap = $('stk-hist-wrap'); if (!wrap) return;
  wrap.innerHTML = '<div class="loading-wrap" style="min-height:80px"><div class="spin"></div></div>';
  try {
    const r = await api('df_stock_moves_by_date', {p_token: S.token, p_date: S.stkDate});
    if (!r.ok) { wrap.innerHTML = `<div class="banner err">${esc(r.error)}</div>`; return; }
    const moves = r.moves || [];
    if (!moves.length) {
      wrap.innerHTML = '<div style="text-align:center;padding:28px;color:var(--text3)">ບໍ່ມີຂໍ້ມູນໃນວັນນີ້</div>';
      return;
    }
    const kLabel = {in:'ຮັບເຂົ້າ', out:'ເບີກອອກ', count:'ນັບສະຕັອກ'};
    const kColor = {in:'#22A06B', out:'#E03E3E', count:'#8E6FD8'};
    const kDim   = {in:'rgba(34,160,107,.12)', out:'rgba(224,62,62,.12)', count:'rgba(142,111,216,.12)'};
    const groups = {in:[], out:[], count:[]};
    moves.forEach(m => { const k = m.kind || 'out'; if (groups[k]) groups[k].push(m); });
    let html = '';
    ['in','out','count'].forEach(k => {
      if (!groups[k].length) return;
      html += `<div class="hist-mv-grp">
        <div class="hist-kind-badge" style="background:${kDim[k]};color:${kColor[k]}">
          <span class="hpip" style="background:${kColor[k]}"></span>${kLabel[k]} · ${groups[k].length}
        </div>`;
      groups[k].forEach(m => {
        const sign = k==='out' ? '−' : (k==='in' ? '+' : '');
        html += `<div class="hist-mv-card">
          <div style="flex:1;min-width:0">
            <div class="hist-mv-name">${esc(m.item)}</div>
            <div class="hist-mv-meta">${esc(m.who||'-')} · ${esc(m.at||'')}${m.note?' · '+esc(m.note):''}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div class="hist-mv-qty" style="color:${kColor[k]}">${sign}${Number(m.qty).toLocaleString()}</div>
            <div class="hist-mv-after">→ ${Number(m.after).toLocaleString()}</div>
          </div>
        </div>`;
      });
      html += '</div>';
    });
    wrap.innerHTML = html;
  } catch (e) {
    const msg = e.message || '';
    if (msg.includes('df_stock_moves_by_date') || msg.includes('PGRST202')) {
      wrap.innerHTML = `<div style="padding:16px;background:#FFF8E7;border-left:3px solid #F6BE52;border-radius:8px;font-size:13px;color:#92600A">
        ⚠️ ຟັງຊັນ <b>df_stock_moves_by_date</b> ຍັງບໍ່ໄດ້ຕິດຕັ້ງ<br>
        <span style="color:var(--text3);font-size:12px">ກະລຸນາຕິດຕໍ່ຜູ້ດູແລລະບົບ ເພື່ອ run SQL ຕິດຕັ້ງ</span></div>`;
    } else {
      wrap.innerHTML = `<div class="banner err">${esc(msg)}</div>`;
    }
  }
}

/* ──────────── Stock history (by month) ──────────── */
async function loadStockHistoryMonth() {
  const wrap = $('stk-hist-wrap'); if (!wrap) return;
  wrap.innerHTML = '<div class="loading-wrap" style="min-height:80px"><div class="spin"></div></div>';
  try {
    const r = await api('df_stock_moves_by_month', {p_token: S.token, p_month: S.stkMonth});
    if (!r.ok) { wrap.innerHTML = `<div class="banner err">${esc(r.error)}</div>`; return; }
    const items = r.items || [];
    if (!items.length) {
      wrap.innerHTML = '<div style="text-align:center;padding:28px;color:var(--text3)">ບໍ່ມີຂໍ້ມູນໃນເດືອນນີ້</div>';
      return;
    }
    const maxBar = Math.max(...items.map(x => Math.max(Number(x.in_qty), Number(x.out_qty))), 1);
    let html = `<div style="font-size:12px;color:var(--text3);margin-bottom:12px">${items.length} ລາຍການ</div>`;
    items.forEach(it => {
      const inn  = Number(it.in_qty);
      const out  = Number(it.out_qty);
      const inW  = Math.round(inn / maxBar * 100);
      const outW = Math.round(out / maxBar * 100);
      html += `<div class="hist-item-card">
        <div class="hist-item-top">
          <div class="hist-item-name">${esc(it.name)}</div>
          <div class="hist-item-chips">
            <span class="hist-chip" style="background:rgba(34,160,107,.12);color:#22A06B">+${inn.toLocaleString()}</span>
            <span class="hist-chip" style="background:rgba(224,62,62,.12);color:#E03E3E">−${out.toLocaleString()}</span>
          </div>
        </div>
        <div class="hist-dual-bar">
          <div class="hist-bar-row"><span class="hist-bar-lbl">ຮັບ</span>
            <div class="hist-bar-track"><div class="hist-bar-fill" style="width:${inW}%;background:#22A06B"></div></div>
          </div>
          <div class="hist-bar-row"><span class="hist-bar-lbl">ໃຊ້</span>
            <div class="hist-bar-track"><div class="hist-bar-fill" style="width:${outW}%;background:#E03E3E"></div></div>
          </div>
        </div>
      </div>`;
    });
    wrap.innerHTML = html;
  } catch (e) {
    const msg = e.message || '';
    if (msg.includes('df_stock_moves_by_month') || msg.includes('PGRST202')) {
      wrap.innerHTML = `<div style="padding:16px;background:#FFF8E7;border-left:3px solid #F6BE52;border-radius:8px;font-size:13px;color:#92600A">
        ⚠️ ຟັງຊັນ <b>df_stock_moves_by_month</b> ຍັງບໍ່ໄດ້ຕິດຕັ້ງ<br>
        <span style="color:var(--text3);font-size:12px">ກະລຸນາ run SQL ໃນ Supabase ຕາມຂັ້ນຕອນດ້ານລ່າງ</span></div>`;
    } else {
      wrap.innerHTML = `<div class="banner err">${esc(msg)}</div>`;
    }
  }
}

/* ============================================================
   ໜ້າຈັດການ (ຜູ້ຈັດການ)
   ============================================================ */
let mgTab = 'staff';
async function loadManage() {
  $('page').innerHTML = `<div class="loading-wrap"><div class="spin"></div><span>ກຳລັງໂຫຼດ...</span></div>`;
  try {
    const [st, sv] = await Promise.all([
      api('df_staff_all', {p_token: S.token}),
      api('df_service_all', {p_token: S.token})]);
    S.cache.staff = st.rows || []; S.cache.svc = sv.rows || [];
    drawManage();
  } catch (e) { $('page').innerHTML = `<div class="banner err">${esc(e.message)}</div>`; }
}
function setMgTab(t){ mgTab=t; drawManage(); }

function drawManage() {
  $('page').innerHTML = `
    <div class="seg">
      <button class="seg-btn ${mgTab==='staff'?'on':''}" onclick="setMgTab('staff')">ພະນັກງານ</button>
      <button class="seg-btn ${mgTab==='svc'?'on':''}" onclick="setMgTab('svc')">ລາຍການ &amp; ລາຄາ</button>
    </div>
    <div id="mg"></div>`;
  mgTab === 'staff' ? drawStaff() : drawSvc();
}

const ROLE_LABEL = {staff:'ພະນັກງານ', viewer:'ຜູ້ບໍລິຫານ', manager:'ຜູ້ຈັດການ'};
function dutyText(s) {
  const d = [];
  if (s.doctor) d.push('ໝໍ');
  if (s.nurse)  d.push('ພະຍາບານ');
  if (s.spa)    d.push('ສະປາ');
  if (s.stock)  d.push('ສາງຢາ');
  if (!d.length) d.push(ROLE_LABEL[s.role] || '—');
  return d.join(' + ');
}

function drawStaff() {
  const rows = S.cache.staff;
  const grp = (t,f) => { const l = rows.filter(f); return !l.length ? '' :
    `<div class="mbox"><div class="mhdr"><span>${t}</span><span>${l.length} ຄົນ</span></div>
     ${l.map(s=>`<div class="mrow">
       <div style="flex:1;min-width:0">
         <div style="font-weight:400">${esc(s.name)}
           ${s.role==='manager'?'<span class="badge">ຜູ້ຈັດການ</span>':(s.role==='viewer'?'<span class="badge">ຜູ້ຖືຮຸ້ນ</span>':'')}</div>
         <div style="font-size:12px;color:var(--muted)">
           ${[s.doctor&&'ໝໍ',s.nurse&&'ພະຍາບານ',s.spa&&'ສະປາ',s.stock&&'ສາງຢາ'].filter(Boolean).join(' + ')||'—'}
           ${s.temp_pin?` · PIN ຊົ່ວຄາວ <b class="serif" style="color:var(--brass);font-size:15px">${esc(s.temp_pin)}</b>`:''}</div>
       </div>
       <div style="display:flex;gap:6px;align-items:center">
         <button class="pill" onclick="openEditStaff('${s.id}')" aria-label="ແກ້ໄຂ">${IC.edit}</button>
         <button class="pill" onclick="resetPin('${s.id}','${esc(s.name)}')" aria-label="ອອກ PIN ໃໝ່">${IC.key}</button>
         <button class="pill ${s.active?'on':'off'}" onclick="toggleStaff('${s.id}',${!s.active})">
           ${s.active?'ໃຊ້ງານ':'ປິດ'}</button>
       </div></div>`).join('')}</div>`; };

  $('mg').innerHTML = `
    <button class="btn-p" style="margin-bottom:18px" onclick="openAddStaff()">
      ${IC.plus} ເພີ່ມພະນັກງານໃໝ່</button>
    ${grp('ໝໍ', s=>s.active&&s.doctor)}
    ${grp('ພະຍາບານ ແລະ ສະປາ', s=>s.active&&!s.doctor&&(s.nurse||s.spa))}
    ${grp('ສາງຢາ', s=>s.active&&s.stock&&!s.doctor&&!s.nurse&&!s.spa)}
    ${grp('ຜູ້ຈັດການ', s=>s.active&&s.role==='manager'&&!s.doctor&&!s.nurse&&!s.spa&&!s.stock)}
    ${grp('ຜູ້ຖືຮຸ້ນ', s=>s.active&&s.role==='viewer')}
    ${grp('ປິດການໃຊ້ງານ', s=>!s.active)}`;
}

function openAddStaff() {
  const ov = document.createElement('div');
  ov.className='overlay'; ov.id='addOv';
  ov.onclick = e => { if (e.target===ov) closeAdd(); };
  ov.innerHTML = `<div class="sheet">
    <div class="handle"></div>
    <h3>ເພີ່ມພະນັກງານໃໝ່</h3>
    <div class="field"><label class="lbl">ຊື່ *</label><input id="ns-name" placeholder="ຊື່ພະນັກງານ"></div>
    <div class="field"><label class="lbl">ເບີໂທ</label><input id="ns-phone" inputmode="numeric" placeholder="ບໍ່ບັງຄັບ"></div>
    <div class="field"><label class="lbl">ໜ້າທີ່ (ເລືອກໄດ້ຫຼາຍ)</label>
      <div class="duty">
        <label class="chk"><input type="checkbox" id="ns-d"> ໝໍ</label>
        <label class="chk"><input type="checkbox" id="ns-n"> ພະຍາບານ</label>
        <label class="chk"><input type="checkbox" id="ns-s"> ສະປາ</label>
        <label class="chk"><input type="checkbox" id="ns-k"> ສາງຢາ</label>
      </div></div>
    <div class="field"><label class="lbl">ສິດການໃຊ້ງານ</label>
      <select id="ns-role">
        <option value="staff">ພະນັກງານ — ເຫັນສະເພາະຂອງຕົນເອງ</option>
        <option value="viewer">ຜູ້ບໍລິຫານ — ເບິ່ງລາຍງານ ແລະ ສະຕັອກ ຢ່າງດຽວ</option>
        <option value="manager">ຜູ້ຈັດການ — ຈັດການໄດ້ທັງໝົດ</option>
      </select></div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn-o" style="flex:1" onclick="closeAdd()">ຍົກເລີກ</button>
      <button class="btn-p" style="flex:2" onclick="addStaff()">ເພີ່ມ</button>
    </div></div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{ const n=$('ns-name'); if(n) n.focus(); }, 100);
}

function openEditStaff(id) {
  const s = (S.cache.staff||[]).find(x=>x.id===id); if (!s) return;
  const ov = document.createElement('div');
  ov.className='overlay'; ov.id='addOv';
  ov.onclick = e => { if (e.target===ov) closeAdd(); };
  ov.innerHTML = `<div class="sheet">
    <div class="handle"></div>
    <h3>ແກ້ໄຂ ${esc(s.name)}</h3>
    <div class="field"><label class="lbl">ເບີໂທ</label>
      <input id="es-phone" inputmode="numeric" value="${esc(s.phone||'')}" placeholder="ບໍ່ບັງຄັບ"></div>
    <div class="field"><label class="lbl">ໜ້າທີ່ (ເລືອກໄດ້ຫຼາຍ)</label>
      <div class="duty">
        <label class="chk"><input type="checkbox" id="es-d" ${s.doctor?'checked':''}> ໝໍ</label>
        <label class="chk"><input type="checkbox" id="es-n" ${s.nurse?'checked':''}> ພະຍາບານ</label>
        <label class="chk"><input type="checkbox" id="es-s" ${s.spa?'checked':''}> ສະປາ</label>
        <label class="chk"><input type="checkbox" id="es-k" ${s.stock?'checked':''}> ສາງຢາ</label>
      </div></div>
    <div class="field"><label class="lbl">ສິດການໃຊ້ງານ</label>
      <select id="es-role">
        <option value="staff"   ${s.role==='staff'?'selected':''}>ພະນັກງານ — ເຫັນສະເພາະຂອງຕົນເອງ</option>
        <option value="viewer"  ${s.role==='viewer'?'selected':''}>ຜູ້ບໍລິຫານ — ເບິ່ງຢ່າງດຽວ</option>
        <option value="manager" ${s.role==='manager'?'selected':''}>ຜູ້ຈັດການ — ຈັດການໄດ້ທັງໝົດ</option>
      </select></div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn-o" style="flex:1" onclick="closeAdd()">ຍົກເລີກ</button>
      <button class="btn-p" style="flex:2" onclick="saveEditStaff('${s.id}')">ບັນທຶກ</button>
    </div></div>`;
  document.body.appendChild(ov);
}

async function saveEditStaff(id) {
  const s = (S.cache.staff||[]).find(x=>x.id===id); if (!s) return;
  try {
    const r = await api('df_staff_update', {p_token: S.token, p_id: id,
      p_phone: $('es-phone').value,
      p_doctor: $('es-d').checked, p_nurse: $('es-n').checked,
      p_spa: $('es-s').checked, p_stock: $('es-k').checked,
      p_active: s.active, p_role: $('es-role').value});
    if (!r.ok) return toast(r.error, false);
    closeAdd(); toast('ບັນທຶກແລ້ວ'); loadManage();
  } catch (e) { toast(e.message, false); }
}

function closeAdd(){ const o=$('addOv'); if(o) o.remove(); }
async function addStaff() {
  try {
    const r = await api('df_staff_add', {p_token: S.token,
      p_name: $('ns-name').value, p_phone: $('ns-phone').value,
      p_doctor: $('ns-d').checked, p_nurse: $('ns-n').checked, p_spa: $('ns-s').checked,
      p_stock: $('ns-k').checked, p_role: $('ns-role').value});
    if (!r.ok) return toast(r.error, false);
    closeAdd();
    alert('ເພີ່ມແລ້ວ\n\nPIN ຊົ່ວຄາວ: ' + r.temp_pin + '\n\nບອກໃຫ້ພະນັກງານ ແລ້ວລາວຈະຕັ້ງ PIN ໃໝ່ເອງ');
    loadManage();
  } catch (e) { toast(e.message, false); }
}
async function toggleStaff(id, active) {
  const s = S.cache.staff.find(x=>x.id===id);
  if (!active && !confirm(`ປິດການໃຊ້ງານ ${s.name}?\nຂໍ້ມູນເກົ່າຈະຍັງຢູ່ຄົບ`)) return;
  try {
    const r = await api('df_staff_update', {p_token: S.token, p_id: id, p_phone: s.phone,
      p_doctor: s.doctor, p_nurse: s.nurse, p_spa: s.spa,
      p_stock: s.stock, p_active: active, p_role: s.role});
    if (!r.ok) return toast(r.error, false);
    toast(active?'ເປີດໃຊ້ງານແລ້ວ':'ປິດແລ້ວ'); loadManage();
  } catch (e) { toast(e.message, false); }
}
async function resetPin(id, name) {
  if (!confirm(`ອອກ PIN ໃໝ່ໃຫ້ ${name}?`)) return;
  try {
    const r = await api('df_staff_reset_pin', {p_token: S.token, p_id: id});
    if (!r.ok) return toast(r.error, false);
    alert('PIN ຊົ່ວຄາວໃໝ່: ' + r.temp_pin);
    loadManage();
  } catch (e) { toast(e.message, false); }
}

function drawSvc() {
  const rows = S.cache.svc;
  const grp = d => { const l = rows.filter(s=>s.dept===d); return `
    <div class="mbox"><div class="mhdr"><span>${CFG[d].label}</span><span>${l.length}</span></div>
    ${l.map(s=>`<div class="mrow">
      <div style="flex:1;min-width:0"><div style="font-weight:400;${s.active?'':'text-decoration:line-through;color:var(--muted)'}">${esc(s.name)}</div></div>
      <input type="number" value="${Number(s.fee)}" style="width:110px;padding:8px;font-size:14px"
             onchange="saveSvc('${d}','${esc(s.name)}',this.value,${s.active})">
      <button class="pill ${s.active?'on':'off'}" onclick="saveSvc('${d}','${esc(s.name)}',${Number(s.fee)},${!s.active})">
        ${s.active?'ເປີດ':'ປິດ'}</button></div>`).join('')}</div>`; };

  $('mg').innerHTML = `
    <button class="btn-p" style="margin-bottom:18px" onclick="openAddSvc()">
      ${IC.plus} ເພີ່ມລາຍການໃໝ່</button>
    ${grp('doctor')}${grp('nurse')}${grp('spa')}`;
}

function openAddSvc() {
  const ov = document.createElement('div');
  ov.className='overlay'; ov.id='addOv';
  ov.onclick = e => { if (e.target===ov) closeAdd(); };
  ov.innerHTML = `<div class="sheet">
    <div class="handle"></div>
    <h3>ເພີ່ມລາຍການໃໝ່</h3>
    <div class="field"><label class="lbl">ພະແນກ</label><select id="nv-dept">
      <option value="doctor">ໝໍ</option><option value="nurse">ພະຍາບານ</option><option value="spa">ສະປາ</option>
    </select></div>
    <div class="field"><label class="lbl">ຊື່ລາຍການ *</label><input id="nv-name" placeholder="ເຊັ່ນ: Botox"></div>
    <div class="field"><label class="lbl">ຄ່າມື (₭)</label><input type="number" id="nv-fee" value="0" inputmode="numeric"></div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn-o" style="flex:1" onclick="closeAdd()">ຍົກເລີກ</button>
      <button class="btn-p" style="flex:2" onclick="addSvc()">ເພີ່ມ</button>
    </div></div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{ const n=$('nv-name'); if(n) n.focus(); }, 100);
}
async function saveSvc(dept, name, fee, active) {
  try {
    const r = await api('df_service_save', {p_token: S.token, p_dept: dept,
      p_name: name, p_fee: Number(fee)||0, p_active: active});
    if (!r.ok) return toast(r.error, false);
    toast('ບັນທຶກແລ້ວ');
    const b = await api('df_bootstrap', {p_token: S.token}); S.services = b.services;
    loadManage();
  } catch (e) { toast(e.message, false); }
}
async function addSvc() {
  const n = $('nv-name').value.trim();
  if (!n) return toast('ກະລຸນາໃສ່ຊື່ລາຍການ', false);
  await saveSvc($('nv-dept').value, n, $('nv-fee').value, true);
  closeAdd();
}

/* ============================================================
   ກວດເວີຊັນໃໝ່
   ============================================================ */
var updateShown = false;
function showUpdateBar() {
  if (updateShown) return;
  updateShown = true;
  var bar = document.createElement('div');
  bar.className = 'update-bar';
  bar.innerHTML = '<span>ມີເວີຊັນໃໝ່ພ້ອມໃຊ້ງານ</span>'
    + '<button onclick="doUpdate()">ອັບເດດ</button>';
  document.body.appendChild(bar);
}
function doUpdate() {
  try { if (window.caches && caches.keys) caches.keys().then(function(ks){ ks.forEach(function(k){caches.delete(k);}); }); } catch(e){}
  location.replace(location.pathname + '?v=' + Date.now());
}
function checkVersion() {
  if (updateShown || document.hidden) return;
  fetch('version.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if (j && j.v && j.v !== APP_VERSION) showUpdateBar(); })
    .catch(function(){});
}
setTimeout(checkVersion, 8000);
setInterval(checkVersion, 10 * 60 * 1000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) checkVersion(); });

clearTimeout(window.__boot);
document.getElementById('root').dataset.ok = '1';
render();
</script>
